<div id="app">
  <header class="topbar" id="topbar">
    <div class="brand" aria-label="圖案偵探">

    const picSpread={easy:[.76,.88],normal:[.68,.93],hard:[.60,.95],expert:[.74,.97]}[level];
    const rotMax={easy:0,normal:10,hard:25,expert:22}[level];
    let best=null,bestPenalty=Infinity;
    function alignmentPenalty(layout){
      let score=0;
      const tolX=Math.max(14,width*.057),tolY=Math.max(13,height*.078);
      for(let i=0;i<layout.length;i++)for(let j=0;j<i;j++){
        const dx=Math.abs(layout[i].x-layout[j].x),dy=Math.abs(layout[i].y-layout[j].y);
        score+=Math.max(0,1-dx/tolX)*1.5;
        score+=Math.max(0,1-dy/tolY)*2.4;
      }
      // 更偏好多個不同高度與水平位置，而不是固定兩行三列。
      const bandsY=new Set(layout.map(p=>Math.floor((p.y-margin)/Math.max(1,innerH)*5)));
      const bandsX=new Set(layout.map(p=>Math.floor((p.x-margin)/Math.max(1,innerW)*5)));
      score+=Math.max(0,Math.min(4,count)-bandsY.size)*2.4;
      score+=Math.max(0,Math.min(4,count)-bandsX.size)*1.2;
      return score;
    }
    for(let pass=0;pass<38;pass++){
      const placed=[];
      // 困難組先放大圖案，令留位可控；並非根據答案 ID 決定大小。
      const slots=Array.from({length:count},(_,i)=>({index:i,scale:range(rng,1-sizeSpread,1+sizeSpread)})).sort((a,b)=>b.scale-a.scale);
      let failed=false;
      for(const slot of slots){
        const tap=Math.max(44,Math.min(cellCap*1.17,base*slot.scale));
        const rotation=range(rng,-rotMax,rotMax);
        const angle=Math.abs(rotation)*Math.PI/180;
        const maxPic=(tap-5)/(Math.cos(angle)+Math.sin(angle));
        const pic=Math.max(29,Math.min(maxPic,maxPic*range(rng,...picSpread)));
        let found=null;
        for(let attempt=0;attempt<190;attempt++){
          const x=range(rng,margin+tap/2,width-margin-tap/2);
          const y=range(rng,margin+tap/2,height-margin-tap/2);
          const candidate={x,y,tap,pic,rotation};
          if(placed.every(p=>!collides(candidate,p,gap))){found=candidate;break;}
        }
        if(!found){failed=true;break;}
        placed.push({...found,index:slot.index});
      }
      if(!failed){const result=placed.sort((a,b)=>a.index-b.index).map(({index,...p})=>p);
        if(verifyLayout(result,width,height,margin,gap)){
          const score=alignmentPenalty(result);
          if(score<bestPenalty){best=result;bestPenalty=score;}
          if(score<.8)break;

      }
    }
    if(best)return best;
    // 安全後備：先用經驗證的錯列分散位置，再在不碰撞的前提下各自擾動。
    // 不使用固定位置配對答案；所有圖案 ID 依然隨機分派到安全位置。
    const fallBackCols=count===3?3:cols,fallBackRows=count===3?1:rows;

    const safeTap=Math.max(44,Math.min(85,stepX-gap-2,stepY-gap-2));
    const result=[];
    const cells=Array.from({length:count},(_,i)=>({x:margin+stepX*(i%fallBackCols+.5),y:margin+stepY*(Math.floor(i/fallBackCols)+.5)}));
    // 對欄位順序洗牌，不讓每次的圖案按陣列序號落在固定位置。
    for(let i=cells.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]];}
    for(const c of cells){
      const tap=safeTap;
      const rotation=range(rng,-rotMax,rotMax);
      const angle=Math.abs(rotation)*Math.PI/180;
      const maxPic=(tap-5)/(Math.cos(angle)+Math.sin(angle));
      let chosen=null;
      for(let attempt=0;attempt<60;attempt++){
        const p={x:c.x+range(rng,-Math.min(13,(stepX-tap)/3),Math.min(13,(stepX-tap)/3)),y:c.y+range(rng,-Math.min(10,(stepY-tap)/3),Math.min(10,(stepY-tap)/3)),tap,pic:Math.max(29,Math.min(maxPic,maxPic*range(rng,...picSpread))),rotation};
        if(verifyLayout([...result,p],width,height,margin,gap)){chosen=p;break;}
      }
      if(!chosen){chosen={x:c.x,y:c.y,tap,pic:maxPic*.77,rotation};}
      result.push(chosen);
    }
    if(!verifyLayout(result,width,height,margin,gap)){

      if(!verifyLayout(emergency,width,height,margin,gap))throw Error('卡牌空間不足，請增加卡牌尺寸');

    }

  }

    else if(type==='tutorial'||type==='tutorial-game'){title='怎樣玩？';content=`<p>兩張卡片之間，<strong style="color:#3357b8">一定只有一個相同圖案</strong>。用手指或滑鼠按一下它，就能過關！</p><div class="tutorial-art"><div class="tut-card">${simpleSvg(0).replace('<svg','<svg class="sample-match"')}${simpleSvg(2)}${simpleSvg(6)}${simpleSvg(4)}</div><div class="tut-card">${simpleSvg(17)}${simpleSvg(10)}${simpleSvg(0).replace('<svg','<svg class="sample-match"')}${simpleSvg(13)}</div></div><div class="tut-note">✦ 兩張卡相同的圖案是「蘋果」！</div><p style="font-size:12px">點選錯誤時會暫停選取約 1.2 秒。連續答對可以獲得獎章。自由練習可以使用提示。</p>`;

    $('modalTitle').textContent=title;$('modalContent').innerHTML=content;$('modalClose').classList.toggle('hidden',!allowX);modalLayer.classList.remove('hidden');(allowX?$('modalClose'):$('modalButtons').querySelector('button')).focus({preventScroll:true});
  }
  $('modalClose').addEventListener('click',closeModal);
  modalLayer.addEventListener('click',evt=>{if(evt.target===modalLayer && ['tutorial','records'].includes(currentModal))closeModal();});
  document.addEventListener('keydown',evt=>{if(evt.key==='Escape'&&currentModal){evt.preventDefault();if(currentModal==='pause'||currentModal==='exit'||currentModal==='tutorial-game')resumeGame();else closeModal();}});
  // 首頁的小型裝飾卡，沿用同一套 SVG 圖案。
  const artItems=[0,2,6,8,11,14];
  const artPositions=[[9,9],[56,2],[26,48]];
  [$('artA'),$('artB')].forEach((el,index)=>{artPositions.forEach(([x,y],i)=>{const wrap=document.createElement('span');wrap.className='art-glyph';wrap.style.left=x+'%';wrap.style.top=y+'%';wrap.innerHTML=simpleSvg(artItems[index*3+i]);el.append(wrap);});});
  // 首頁初次顯示。
  showScreen('home');
})();
</script>
</body>
</html>
